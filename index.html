<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TETRIS GAMEBOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d1a;
  color: white;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  height: 100dvh;
  touch-action: none;
}

/* ── HUD ── */
#hud {
  display: flex;
  gap: 14px;
  margin-top: 8px;
  font-size: 11px;
  flex-wrap: wrap;
  justify-content: center;
  color: #aaa;
}
#hud span { color: #ffe600; }

/* ── ÁREA DE JUEGO ── */
#game-area {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-top: 8px;
}

#board {
  background: #050510;
  border: 2px solid #00f5ff;
  box-shadow: 0 0 10px #00f5ff44;
  display: block;
  touch-action: none;
}

/* ── PANEL LATERAL ── */
#side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: #555;
}
#next-canvas {
  border: 1px solid #222;
  background: #050510;
  display: block;
}

/* ── CONTROLES ── */
#controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 6px;
  margin-top: 8px;
  width: 174px;
}

.btn {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  color: #ccc;
  font-size: 20px;
  height: 52px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active { background: #1c2a2a; border-color: #00f5ff; color: #00f5ff; }

/* ── OVERLAY ── */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 10;
  text-align: center;
  padding: 20px;
}
#overlay h1, #overlay h2 {
  color: #00f5ff;
  text-shadow: 0 0 12px #00f5ff;
  letter-spacing: 4px;
}
#overlay p { font-size: 11px; color: #777; line-height: 1.8; }
#overlay .result { font-size: 14px; color: #ffe600; margin: 10px 0; }

button {
  padding: 12px 24px;
  font-family: monospace;
  font-size: 12px;
  cursor: pointer;
  background: #00f5ff;
  color: #000;
  border: none;
  font-weight: bold;
}
button.secondary {
  background: #1a1a1a;
  color: #ff2d55;
  border: 1px solid #ff2d55;
}
</style>
</head>
<body>

<div id="overlay">
  <h1>TETRIS</h1>
  <p>Cargando datos del bot...</p>
</div>

<div id="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div>LEVEL: <span id="level">1</span></div>
  <div>TIME:  <span id="time">00:00</span></div>
</div>

<div id="game-area">
  <canvas id="board"></canvas>
  <div id="side">
    <div>NEXT</div>
    <canvas id="next-canvas"></canvas>
  </div>
</div>

<div id="controls">
  <div></div>
  <button class="btn" id="btn-up">↑</button>
  <div></div>
  <button class="btn" id="btn-left">←</button>
  <button class="btn" id="btn-down">↓</button>
  <button class="btn" id="btn-right">→</button>
</div>

<script>
/** * INTEGRACIÓN TELEGRAM Y MURO DE VIDAS
 */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const urlParams = new URLSearchParams(window.location.search);
const vidasDisponibles = parseInt(urlParams.get('vidas') || "0");

// Inicializar pantalla según vidas
window.addEventListener('load', () => {
    const overlay = document.getElementById("overlay");
    if (vidasDisponibles <= 0) {
        overlay.innerHTML = `
            <h1 style="color: #ff2d55; text-shadow: 0 0 15px #ff2d55;">SIN VIDAS</h1>
            <p>No te quedan vidas disponibles.<br>Espera a que se recarguen en el bot.</p>
            <button class="secondary" onclick="tg.close()">CERRAR JUEGO</button>
        `;
    } else {
        overlay.innerHTML = `
            <h1>TETRIS</h1>
            <p>TAP: rotar | SWIPE: mover<br>O usa los botones de abajo</p>
            <button onclick="startGame()">EMPEZAR JUEGO</button>
        `;
    }
});

/**
 * LÓGICA DEL JUEGO TETRIS
 */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const nCanvas = document.getElementById("next-canvas");
const nCtx = nCanvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
let SIZE, NB;

const PIECES = [
  { cells: [[0,0],[1,0],[2,0],[3,0]], color: "#00f5ff" },
  { cells: [[0,0],[1,0],[0,1],[1,1]], color: "#ffe600" },
  { cells: [[1,0],[0,1],[1,1],[2,1]], color: "#bf00ff" },
  { cells: [[0,0],[0,1],[1,1],[2,1]], color: "#1a6aff" },
  { cells: [[2,0],[0,1],[1,1],[2,1]], color: "#ff6a00" },
  { cells: [[1,0],[2,0],[0,1],[1,1]], color: "#00ff6a" },
  { cells: [[0,0],[1,0],[1,1],[2,1]], color: "#ff2d55" },
];

let G = null, dropCounter = 0, dropInterval = 600, lastTime = 0, rafID = null;

function resize() {
  const availW = Math.min(window.innerWidth - 80, 300);
  const availH = Math.min(window.innerHeight - 220, 600);
  SIZE = Math.floor(Math.min(availW / COLS, availH / ROWS));
  NB = Math.max(14, Math.floor(SIZE * 0.7));
  canvas.width = SIZE * COLS;
  canvas.height = SIZE * ROWS;
  nCanvas.width = NB * 4;
  nCanvas.height = NB * 4;
  if (G) drawAll();
}
window.addEventListener("resize", resize);
resize();

function randPiece() {
  const def = PIECES[Math.floor(Math.random() * PIECES.length)];
  return { cells: def.cells.map(c => [...c]), color: def.color, ox: 3, oy: 0 };
}

function rotateCells(cells) {
  const minX = Math.min(...cells.map(c => c[0])), minY = Math.min(...cells.map(c => c[1]));
  const norm = cells.map(([x,y]) => [x - minX, y - minY]);
  const maxY = Math.max(...norm.map(c => c[1]));
  return norm.map(([x,y]) => [maxY - y, x]);
}

function isValid(cells, ox, oy) {
  for (const [x, y] of cells) {
    const nx = ox + x, ny = oy + y;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && G.board[ny][nx] !== null) return false;
  }
  return true;
}

function startGame() {
  if (vidasDisponibles <= 0) return;
  document.getElementById("overlay").style.display = "none";
  G = {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    cur: randPiece(), next: randPiece(),
    score: 0, lines: 0, level: 1, running: true, start: Date.now()
  };
  dropCounter = 0; lastTime = 0; dropInterval = 600;
  requestAnimationFrame(loop);
}

function drop() {
  if (!G?.running) return;
  if (isValid(G.cur.cells, G.cur.ox, G.cur.oy + 1)) G.cur.oy++;
  else lockPiece();
}

function lockPiece() {
  for (const [x, y] of G.cur.cells) {
    if (G.cur.oy + y < 0) { endGame(); return; }
    G.board[G.cur.oy + y][G.cur.ox + x] = G.cur.color;
  }
  clearLines();
  G.cur = G.next; G.next = randPiece();
  if (!isValid(G.cur.cells, G.cur.ox, G.cur.oy)) endGame();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (G.board[r].every(v => v !== null)) {
      G.board.splice(r, 1);
      G.board.unshift(Array(COLS).fill(null));
      cleared++; r++;
    }
  }
  if (cleared > 0) {
    const pts = [0, 100, 300, 500, 800];
    G.score += pts[Math.min(cleared, 4)] * G.level;
    G.lines += cleared;
    G.level = Math.floor(G.lines / 10) + 1;
    dropInterval = Math.max(80, 600 - (G.level - 1) * 50);
  }
}

function drawBlock(ctx, color, x, y, s) {
  ctx.fillStyle = "#000"; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = color; ctx.fillRect(x+1, y+1, s-2, s-2);
}

function drawAll() {
  ctx.fillStyle = "#050510"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (G.board[r][c]) drawBlock(ctx, G.board[r][c], c * SIZE, r * SIZE, SIZE);

  if (G.running) {
    for (const [x, y] of G.cur.cells)
      drawBlock(ctx, G.cur.color, (G.cur.ox + x) * SIZE, (G.cur.oy + y) * SIZE, SIZE);
  }

  nCtx.fillStyle = "#050510"; nCtx.fillRect(0, 0, nCanvas.width, nCanvas.height);
  for (const [x, y] of G.next.cells) drawBlock(nCtx, G.next.color, (x+1)*NB, (y+1)*NB, NB);
}

function loop(time = 0) {
  if (!G?.running) return;
  const delta = time - lastTime; lastTime = time;
  dropCounter += delta;
  if (dropCounter >= dropInterval) { drop(); dropCounter = 0; }
  drawAll();
  document.getElementById("score").textContent = G.score;
  document.getElementById("level").textContent = G.level;
  const t = Math.floor((Date.now() - G.start) / 1000);
  document.getElementById("time").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  rafID = requestAnimationFrame(loop);
}

// Controles táctiles y teclado
document.addEventListener("keydown", e => {
  if (!G?.running) return;
  if (e.key === "ArrowLeft") moveX(-1);
  if (e.key === "ArrowRight") moveX(1);
  if (e.key === "ArrowDown") drop();
  if (e.key === "ArrowUp") { const r = rotateCells(G.cur.cells); if (isValid(r, G.cur.ox, G.cur.oy)) G.cur.cells = r; }
});

const addBtn = (id, fn) => document.getElementById(id).addEventListener("touchstart", e => { e.preventDefault(); fn(); });
addBtn("btn-left", () => moveX(-1));
addBtn("btn-right", () => moveX(1));
addBtn("btn-up", () => { const r = rotateCells(G.cur.cells); if (isValid(r, G.cur.ox, G.cur.oy)) G.cur.cells = r; });
addBtn("btn-down", () => drop());

function moveX(d) { if (isValid(G.cur.cells, G.cur.ox + d, G.cur.oy)) G.cur.ox += d; }

function endGame() {
  G.running = false;
  const overlay = document.getElementById("overlay");
  overlay.innerHTML = `
    <h2>GAME OVER</h2>
    <div class="result">SCORE: ${G.score}</div>
    <button onclick="sendData()">ENVIAR Y SALIR</button>
  `;
  overlay.style.display = "flex";
}

function sendData() {
  if (tg?.sendData) {
    tg.sendData(JSON.stringify({ score: G.score }));
  } else {
    tg.close();
  }
}
</script>
</body>
</html>
