<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TETRIS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ── TUS ESTILOS ORIGINALES REPETIDOS ── */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d1a;
  color: white;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  height: 100dvh;
  touch-action: none;
}

#hud {
  display: flex;
  gap: 14px;
  margin-top: 8px;
  font-size: 11px;
  flex-wrap: wrap;
  justify-content: center;
  color: #aaa;
}
#hud span { color: #ffe600; }

#game-area {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-top: 8px;
}

#board {
  background: #050510;
  border: 2px solid #00f5ff;
  box-shadow: 0 0 10px #00f5ff44;
  display: block;
  touch-action: none;
}

#side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: #555;
}
#next-canvas {
  border: 1px solid #222;
  background: #050510;
  display: block;
}

#controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 6px;
  margin-top: 8px;
  width: 174px;
}

.btn {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  color: #ccc;
  font-size: 20px;
  height: 52px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active { background: #1c2a2a; border-color: #00f5ff; color: #00f5ff; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 10;
  text-align: center;
  padding: 20px;
}
#overlay h1, #overlay h2 {
  color: #00f5ff;
  text-shadow: 0 0 12px #00f5ff;
  letter-spacing: 4px;
}
#overlay p { font-size: 11px; color: #555; line-height: 1.8; }
#overlay .result { font-size: 12px; color: #ffe600; line-height: 2; }

button {
  padding: 10px 22px;
  font-family: monospace;
  font-size: 12px;
  cursor: pointer;
  background: #00f5ff;
  color: #000;
  border: none;
  letter-spacing: 1px;
}
button.secondary {
  background: #1a1a1a;
  color: #777;
  border: 1px solid #333;
}
</style>
</head>
<body>

<div id="overlay">
  <h1>TETRIS</h1>
  <p>Cargando datos...</p>
</div>

<div id="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div>LINES: <span id="lines">0</span></div>
  <div>LEVEL: <span id="level">1</span></div>
  <div>TIME:  <span id="time">00:00</span></div>
</div>

<div id="game-area">
  <canvas id="board"></canvas>
  <div id="side">
    <div>NEXT</div>
    <canvas id="next-canvas"></canvas>
  </div>
</div>

<div id="controls">
  <div></div>
  <button class="btn" id="btn-up">↑</button>
  <div></div>
  <button class="btn" id="btn-left">←</button>
  <button class="btn" id="btn-down">↓</button>
  <button class="btn" id="btn-right">→</button>
</div>

<script>
/* ── CONFIGURACIÓN TELEGRAM Y VIDAS ── */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const urlParams = new URLSearchParams(window.location.search);
const vidasDisponibles = parseInt(urlParams.get('vidas') || "0");

// Al cargar, decidimos qué mostrar en el overlay
window.addEventListener('load', () => {
    const overlay = document.getElementById("overlay");
    if (vidasDisponibles <= 0) {
        overlay.innerHTML = `
            <h1 style="color: #ff2d55; text-shadow: 0 0 12px #ff2d55;">SIN VIDAS</h1>
            <p>Se han agotado tus vidas.<br>Espera a que se recarguen para volver a jugar.</p>
            <button class="secondary" onclick="tg.close()">CERRAR JUEGO</button>
        `;
    } else {
        overlay.innerHTML = `
            <h1>TETRIS</h1>
            <p>TAP: rotar &nbsp;|&nbsp; SWIPE: mover/bajar<br>O usa los botones de abajo</p>
            <button onclick="startGame()">JUGAR</button>
        `;
    }
});

/* ── MOTOR DEL JUEGO (TU LÓGICA ORIGINAL) ── */
const canvas = document.getElementById("board");
const ctx    = canvas.getContext("2d");
const nCanvas = document.getElementById("next-canvas");
const nCtx    = nCanvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
let SIZE = 28;
let NB = 20;

const PIECES = [
  { cells: [[0,0],[1,0],[2,0],[3,0]], color: "#00f5ff" },
  { cells: [[0,0],[1,0],[0,1],[1,1]], color: "#ffe600" },
  { cells: [[1,0],[0,1],[1,1],[2,1]], color: "#bf00ff" },
  { cells: [[0,0],[0,1],[1,1],[2,1]], color: "#1a6aff" },
  { cells: [[2,0],[0,1],[1,1],[2,1]], color: "#ff6a00" },
  { cells: [[1,0],[2,0],[0,1],[1,1]], color: "#00ff6a" },
  { cells: [[0,0],[1,0],[1,1],[2,1]], color: "#ff2d55" },
];

let G = null, dropCounter = 0, dropInterval = 600, lastTime = 0, rafID = null;

function resize() {
  const availW = Math.min(window.innerWidth - 80, 300);
  const availH = Math.min(window.innerHeight - 200, 600);
  SIZE = Math.floor(Math.min(availW / COLS, availH / ROWS));
  SIZE = Math.max(SIZE, 16);
  NB = Math.max(14, Math.floor(SIZE * 0.7));
  canvas.width = SIZE * COLS;
  canvas.height = SIZE * ROWS;
  nCanvas.width = NB * 4;
  nCanvas.height = NB * 4;
  if (G) drawAll();
}
window.addEventListener("resize", resize);
resize();

function randPiece() {
  const def = PIECES[Math.floor(Math.random() * PIECES.length)];
  return { cells: def.cells.map(c => [...c]), color: def.color, ox: 3, oy: 0 };
}

function rotateCells(cells) {
  const minX = Math.min(...cells.map(c => c[0])), minY = Math.min(...cells.map(c => c[1]));
  const norm = cells.map(([x,y]) => [x - minX, y - minY]);
  const maxY = Math.max(...norm.map(c => c[1]));
  return norm.map(([x,y]) => [maxY - y, x]);
}

function isValid(cells, ox, oy) {
  for (const [x, y] of cells) {
    const nx = ox + x, ny = oy + y;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && G.board[ny][nx] !== null) return false;
  }
  return true;
}

function newGame() {
  return {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    cur: randPiece(), next: randPiece(),
    score: 0, lines: 0, level: 1, running: true, start: Date.now()
  };
}

function drop() {
  if (!G?.running) return;
  if (isValid(G.cur.cells, G.cur.ox, G.cur.oy + 1)) G.cur.oy++;
  else lockPiece();
}

function lockPiece() {
  for (const [x, y] of G.cur.cells) {
    if (G.cur.oy + y < 0) { endGame(); return; }
    G.board[G.cur.oy + y][G.cur.ox + x] = G.cur.color;
  }
  clearLines();
  G.cur = G.next; G.next = randPiece();
  if (!isValid(G.cur.cells, G.cur.ox, G.cur.oy)) endGame();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (G.board[r].every(v => v !== null)) {
      G.board.splice(r, 1);
      G.board.unshift(Array(COLS).fill(null));
      cleared++; r++;
    }
  }
  if (!cleared) return;
  const pts = [0, 100, 300, 500, 800];
  G.score += (pts[Math.min(cleared, 4)]) * G.level;
  G.lines += cleared;
  G.level = Math.floor(G.lines / 10) + 1;
  dropInterval = Math.max(80, 600 - (G.level - 1) * 55);
}

function moveX(dir) {
  if (!G?.running) return;
  if (isValid(G.cur.cells, G.cur.ox + dir, G.cur.oy)) G.cur.ox += dir;
}

function rotate() {
  if (!G?.running) return;
  const rotated = rotateCells(G.cur.cells);
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (isValid(rotated, G.cur.ox + k, G.cur.oy)) {
      G.cur.cells = rotated; G.cur.ox += k; return;
    }
  }
}

function drawBlock(c, color, px, py, size) {
  c.fillStyle = "#000"; c.fillRect(px, py, size, size);
  c.fillStyle = color; c.fillRect(px + 1, py + 1, size - 2, size - 2);
  c.fillStyle = "rgba(255,255,255,0.25)";
  c.fillRect(px + 1, py + 1, size - 2, 3);
  c.fillRect(px + 1, py + 1, 3, size - 2);
}

function drawAll() {
  ctx.fillStyle = "#050510"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (G.board[r][c]) drawBlock(ctx, G.board[r][c], c * SIZE, r * SIZE, SIZE);
  if (!G.running) return;
  // Ghost
  let gy = G.cur.oy; while (isValid(G.cur.cells, G.cur.ox, gy + 1)) gy++;
  ctx.globalAlpha = 0.22;
  for (const [x, y] of G.cur.cells) {
    ctx.strokeStyle = G.cur.color;
    ctx.strokeRect((G.cur.ox + x) * SIZE + 1, (gy + y) * SIZE + 1, SIZE - 2, SIZE - 2);
  }
  ctx.globalAlpha = 1;
  for (const [x, y] of G.cur.cells)
    drawBlock(ctx, G.cur.color, (G.cur.ox + x) * SIZE, (G.cur.oy + y) * SIZE, SIZE);

  // Next
  nCtx.fillStyle = "#050510"; nCtx.fillRect(0, 0, nCanvas.width, nCanvas.height);
  const nxMinX = Math.min(...G.next.cells.map(c => c[0])), nxMinY = Math.min(...G.next.cells.map(c => c[1]));
  const nxMaxX = Math.max(...G.next.cells.map(c => c[0])), nxMaxY = Math.max(...G.next.cells.map(c => c[1]));
  const offX = Math.floor((4-(nxMaxX-nxMinX+1))/2)-nxMinX, offY = Math.floor((4-(nxMaxY-nxMinY+1))/2)-nxMinY;
  for (const [x, y] of G.next.cells) drawBlock(nCtx, G.next.color, (offX+x)*NB, (offY+y)*NB, NB);
}

function loop(time = 0) {
  if (!G?.running) return;
  const delta = time - lastTime; lastTime = time;
  dropCounter += delta;
  if (dropCounter >= dropInterval) { drop(); dropCounter = 0; }
  drawAll();
  document.getElementById("score").textContent = G.score;
  document.getElementById("lines").textContent = G.lines;
  document.getElementById("level").textContent = G.level;
  const t = Math.floor((Date.now() - G.start) / 1000);
  document.getElementById("time").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  rafID = requestAnimationFrame(loop);
}

/* ── CONTROLES ── */
document.addEventListener("keydown", e => {
  if (!G?.running) return;
  if (e.key === "ArrowLeft") moveX(-1);
  if (e.key === "ArrowRight") moveX(1);
  if (e.key === "ArrowDown") drop();
  if (e.key === "ArrowUp") rotate();
  if (e.key === " ") { while (isValid(G.cur.cells, G.cur.ox, G.cur.oy + 1)) G.cur.oy++; drop(); }
});

const addTBtn = (id, action) => {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", e => { e.preventDefault(); action(); }, {passive: false});
}
addTBtn("btn-left", () => moveX(-1));
addTBtn("btn-right", () => moveX(1));
addTBtn("btn-up", () => rotate());
addTBtn("btn-down", () => { while (isValid(G.cur.cells, G.cur.ox, G.cur.oy + 1)) G.cur.oy++; drop(); });

/* ── INICIO Y FIN PROTEGIDOS ── */
function startGame() {
  if (vidasDisponibles <= 0) return; // Muro de seguridad
  document.getElementById("overlay").style.display = "none";
  G = newGame();
  dropCounter = 0; lastTime = 0;
  requestAnimationFrame(loop);
}

function endGame() {
  G.running = false;
  window.finalData = { score: G.score, tiempo: document.getElementById("time").textContent };
  document.getElementById("overlay").innerHTML = `
    <h2>GAME OVER</h2>
    <div class="result">SCORE: ${G.score}</div>
    <button onclick="sendData()">✓ ENVIAR Y SALIR</button>
  `;
  document.getElementById("overlay").style.display = "flex";
}

function sendData() {
  if (tg?.sendData) {
    tg.sendData(JSON.stringify({ score: window.finalData.score }));
  } else {
    tg.close();
  }
}
</script>
</body>
</html>
