<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TETRIS</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      font-family: 'Press Start 2P', monospace;
      color: #eee;
      overflow: hidden;
      padding-top: 8px;
    }

    #topbar {
      display: flex;
      gap: 16px;
      margin-bottom: 6px;
      font-size: 8px;
    }

    .stat { text-align: center; }
    .stat-label { color: #555; font-size: 6px; margin-bottom: 2px; }
    .stat-val { color: #ffe600; text-shadow: 0 0 6px #ffe600; }

    #game-wrap {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    canvas#board {
      border: 2px solid #00f5ff;
      box-shadow: 0 0 12px #00f5ff55;
      display: block;
      image-rendering: pixelated;
    }

    #side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 7px;
    }

    .side-box {
      border: 1px solid #222;
      padding: 6px;
      text-align: center;
      background: #111;
    }

    .side-box .lbl {
      color: #444;
      font-size: 5px;
      margin-bottom: 4px;
    }

    #next-canvas {
      image-rendering: pixelated;
      display: block;
      margin: 0 auto;
    }

    #controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
      margin-top: 8px;
    }

    .cbtn {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cbtn:active {
      background: #1a2a2a;
      border-color: #00f5ff;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 50;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      font-size: 28px;
      color: #00f5ff;
      text-shadow: 0 0 16px #00f5ff;
      animation: blink 1s step-end infinite;
    }

    .ov-result { font-size: 9px; color: #ffe600; line-height: 2.2; }
    .ov-sub    { font-size: 7px; color: #555; line-height: 2; }

    .play-btn {
      background: #00f5ff;
      color: #000;
      border: none;
      font-family: 'Press Start 2P';
      font-size: 9px;
      padding: 14px 28px;
      cursor: pointer;
      box-shadow: 0 0 16px #00f5ff;
    }

    .retry-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      font-size: 8px;
      padding: 10px 20px;
      cursor: pointer;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- OVERLAY -->
  <div id="overlay">
    <h1>TETRIS</h1>
    <div class="ov-sub">
      ARRIBA: rotar &nbsp; ABAJO: bajar<br>
      IZQ / DER: mover
    </div>
    <button class="play-btn" id="btnPlay">JUGAR</button>
  </div>

  <!-- HUD -->
  <div id="topbar">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-val" id="dScore">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">NIVEL</div>
      <div class="stat-val" id="dLevel">1</div>
    </div>
    <div class="stat">
      <div class="stat-label">LÍNEAS</div>
      <div class="stat-val" id="dLines">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">TIEMPO</div>
      <div class="stat-val" id="dTime">00:00</div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-wrap">
    <canvas id="board"></canvas>

    <div id="side">
      <div class="side-box">
        <div class="lbl">NEXT</div>
        <canvas id="next-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- CONTROLES -->
  <div id="controls">
    <div></div>
    <button class="cbtn" id="btn-up">↑</button>
    <div></div>
    <button class="cbtn" id="btn-left">←</button>
    <button class="cbtn" id="btn-down">↓</button>
    <button class="cbtn" id="btn-right">→</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Aquí mantienes TODO tu JS igual (ya está bastante limpio)
  </script>

</body>
</html>
