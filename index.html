<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TETRIS</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      font-family: 'Press Start 2P', monospace;
      color: #eee;
      overflow: hidden;
      padding-top: 8px;
    }

    #topbar {
      display: flex;
      gap: 16px;
      margin-bottom: 6px;
      font-size: 8px;
    }

    .stat { text-align: center; }

    .stat-label {
      color: #555;
      font-size: 6px;
      margin-bottom: 2px;
    }

    .stat-val {
      color: #ffe600;
      text-shadow: 0 0 6px #ffe600;
    }

    #game-wrap {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    canvas#board {
      border: 2px solid #00f5ff;
      box-shadow: 0 0 12px #00f5ff55;
      display: block;
      image-rendering: pixelated;
    }

    #side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 7px;
    }

    .side-box {
      border: 1px solid #222;
      padding: 6px;
      text-align: center;
      background: #111;
    }

    .side-box .lbl {
      color: #444;
      font-size: 5px;
      margin-bottom: 4px;
    }

    #next-canvas {
      image-rendering: pixelated;
      display: block;
      margin: 0 auto;
    }

    #controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
      margin-top: 8px;
    }

    .cbtn {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .cbtn:active {
      background: #1a2a2a;
      border-color: #00f5ff;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 50;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      font-size: 28px;
      color: #00f5ff;
      text-shadow: 0 0 16px #00f5ff;
      animation: blink 1s step-end infinite;
    }

    .ov-result {
      font-size: 9px;
      color: #ffe600;
      line-height: 2.2;
    }

    .ov-sub {
      font-size: 7px;
      color: #555;
      line-height: 2;
    }

    .play-btn {
      background: #00f5ff;
      color: #000;
      border: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 14px 28px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 16px #00f5ff;
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .retry-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 10px 20px;
      cursor: pointer;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

  <div id="overlay">
    <h1>TETRIS</h1>
    <div class="ov-sub">
      ARRIBA: rotar &nbsp; ABAJO: bajar<br>
      IZQ / DER: mover
    </div>
    <button class="play-btn" id="btnPlay">JUGAR</button>
  </div>

  <div id="topbar">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-val" id="dScore">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">NIVEL</div>
      <div class="stat-val" id="dLevel">1</div>
    </div>

    <div class="stat">
      <div class="stat-label">LÍNEAS</div>
      <div class="stat-val" id="dLines">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">TIEMPO</div>
      <div class="stat-val" id="dTime">00:00</div>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="board"></canvas>

    <div id="side">
      <div class="side-box">
        <div class="lbl">NEXT</div>
        <canvas id="next-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="controls">
    <div></div>
    <button class="cbtn" id="btn-up">↑</button>
    <div></div>

    <button class="cbtn" id="btn-left">←</button>
    <button class="cbtn" id="btn-down">↓</button>
    <button class="cbtn" id="btn-right">→</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const boardCanvas = document.getElementById('board');
    const bCtx = boardCanvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nCtx = nextCanvas.getContext('2d');

    const COLS = 10, ROWS = 20;
    let B = 24;

    function calcSize() {
      const availH = window.innerHeight - 200;
      const availW = (window.innerWidth - 80) * 0.72;

      B = Math.max(16, Math.floor(Math.min(availH / ROWS, availW / COLS)));

      boardCanvas.width = COLS * B;
      boardCanvas.height = ROWS * B;

      const nb = Math.max(12, Math.floor(B * 0.72));
      nextCanvas.width = 4 * nb;
      nextCanvas.height = 4 * nb;
      nextCanvas._nb = nb;
    }

    calcSize();
    window.addEventListener('resize', () => {
      calcSize();
      if (G) renderAll();
    });

    const DEFS = [
      { cells: [[0,0],[1,0],[2,0],[3,0]], color:'#00f5ff' },
      { cells: [[0,0],[1,0],[0,1],[1,1]], color:'#ffe600' },
      { cells: [[1,0],[0,1],[1,1],[2,1]], color:'#bf00ff' },
      { cells: [[2,0],[0,1],[1,1],[2,1]], color:'#ff6a00' },
      { cells: [[0,0],[0,1],[1,1],[2,1]], color:'#1a6aff' },
      { cells: [[1,0],[2,0],[0,1],[1,1]], color:'#00ff6a' },
      { cells: [[0,0],[1,0],[1,1],[2,1]], color:'#ff2d55' },
    ];

    function randPiece() {
      const d = DEFS[Math.floor(Math.random() * DEFS.length)];
      return {
        cells: d.cells.map(c => [...c]),
        color: d.color,
        ox: 3,
        oy: 0
      };
    }

    function rotateCells(cells) {
      const minX = Math.min(...cells.map(c => c[0]));
      const minY = Math.min(...cells.map(c => c[1]));
      const maxX = Math.max(...cells.map(c => c[0]));
      const maxY = Math.max(...cells.map(c => c[1]));

      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      return cells.map(([x, y]) => [
        Math.round(cy - y + cx),
        Math.round(x - cx + cy)
      ]);
    }

    let G = null;

    function newGame() {
      return {
        board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
        cur: randPiece(),
        next: randPiece(),
        score: 0,
        level: 1,
        lines: 0,
        running: true,
        t0: Date.now(),
        elapsed: 0,
      };
    }

    function valid(cells, ox, oy, board) {
      for (const [x, y] of cells) {
        const nx = ox + x, ny = oy + y;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
        if (ny >= 0 && board[ny][nx] !== null) return false;
      }
      return true;
    }

    function drop() {
      if (!G?.running) return;

      if (valid(G.cur.cells, G.cur.ox, G.cur.oy + 1, G.board)) {
        G.cur.oy++;
      } else {
        lock();
      }

      renderAll();
    }

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      G = newGame();
      renderAll();
    }

    document.getElementById('btnPlay').addEventListener('click', startGame);
  </script>

</body>
</html>
